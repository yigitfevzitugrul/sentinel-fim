name: CI
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Development toolchain (rust-toolchain.toml) and the MSRV.
        toolchain: ["1.99.1", "1.88.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal -c rustfmt,clippy && rustup override set ${{ matrix.toolchain }}
      - run: cargo fmt --check
        if: matrix.toolchain == '1.99.1'
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: matrix.toolchain == '1.99.1'
      - run: cargo test --locked
      - run: cargo bench --no-run --locked
        if: matrix.toolchain == '1.99.1'
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

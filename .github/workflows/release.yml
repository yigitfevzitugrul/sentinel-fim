name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="sentinel-fim-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/sentinel-fim${{ matrix.ext }}" "$name"
          sha256sum "$name" > "$name.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: sentinel-fim-*

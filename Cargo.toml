[package]
name = "sentinel-fim"
version = "0.1.0"
edition = "2024"
# Required by sha2 0.11, notify 8 and globset 0.4.20.
rust-version = "1.88"
description = "A file integrity monitor: baseline, scan and detect file changes."
license = "MIT OR Apache-2.0"
authors = ["Yiğit Fevzi Tuğrul"]
keywords = ["fim", "integrity", "security", "hash", "monitor"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
ed25519-dalek = "3"
getrandom = "0.4"
globset = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Default features (alloc, oid) are not needed; keep the dependency tree small.
sha2 = { version = "0.11", default-features = false }
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
walkdir = "2"
zeroize = "1"

[lints.rust]
# A security tool has no business using unsafe code.
unsafe_code = "forbid"

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
blake3 = "1"
criterion = "0.8"
predicates = "3"
proptest = "1"

[[bench]]
name = "hashing"
harness = false

[[bench]]
name = "scan"
harness = false
